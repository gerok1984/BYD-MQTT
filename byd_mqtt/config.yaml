name: BYD MQTT
version: "1.1.0"
url: https://github.com/gerok1984/BYD-MQTT
slug: dolphin_mqtt_funnel
description: Remote MQTT via Tailscale Funnel or EMQX Cloud (beta).
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: false
homeassistant_api: true
services:
  - mqtt:need
options:
  mode: tailscale
  publish: false
  tailscale_auth_key: ""
schema:
  mode: list(tailscale|emqx)?
  publish: bool
  tailscale_auth_key: password?
  emqx_host: str?
  emqx_username: str?
  emqx_password: password?
  electro_topic: str?
