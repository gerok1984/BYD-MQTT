configuration:
  mode:
    name: Modo de conexión
    description: Elige Tailscale Funnel o EMQX Cloud (beta).
  electro_topic:
    name: Tópico de Electro
    description: Copia el tópico exacto que muestra Electro. Se usa para datos y comandos.
  emqx_host:
    name: Servidor EMQX
    description: Introduce el nombre DNS de tu despliegue en modo EMQX.
  emqx_username:
    name: Usuario EMQX
    description: Introduce el usuario MQTT del puente.
  emqx_password:
    name: Contraseña EMQX
    description: Introduce la contraseña MQTT del puente.
